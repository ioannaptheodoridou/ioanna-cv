<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ioanna's Room</title>
<meta name="description" content="Ioanna Theodoridou, Business Application Analyst in Athens. An interactive CV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: the rendered room is the whole hero, melting into a dark page; objects glow on hover and open a sheet (bottom on phones, side on desktop). Single dark look on purpose, to match the render. */
:root{
  --bg:#0C0B0B; --surface:#1A1617; --raised:#241E1F; --ink:#F3EBE6; --muted:#A99D98; --line:#2F2829;
  --amber:#F2A54A; --amber-soft:rgba(242,165,74,.18); --teal:#5DBFB4;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.intro{margin:10px 0 0;color:var(--muted);max-width:52ch}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:500 14px var(--f-body);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.counter b{color:var(--amber);font-weight:500}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* stage */
.stage{position:relative;overflow:hidden;border-radius:18px}
.room{position:relative;width:100%;aspect-ratio:1600/893;max-width:100%}
.room img{position:absolute;inset:0;width:100%;height:100%;display:block;
  -webkit-mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 62% 70% at 50% 50%,#000 70%,transparent 100%)}
@media (max-width:720px){
  /* crop to the room itself so objects stay tappable on a phone */
  .room{width:152%;max-width:none;margin-left:-27%}
  .dot{width:10px;height:10px;margin:-5px 0 0 -5px}
}
.spot{position:absolute;background:transparent;border:0;border-radius:14px;cursor:pointer;padding:0;transition:box-shadow .2s,background .2s}
.spot:hover,.spot:focus-visible{background:var(--amber-soft);box-shadow:0 0 0 1.5px rgba(242,165,74,.7),0 0 28px rgba(242,165,74,.35);outline:none}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(12,11,11,.55);pointer-events:none}
.dot::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--amber);animation:halo 2.2s ease-out infinite}
.dot.seen{background:var(--teal);width:9px;height:9px;margin:-4.5px 0 0 -4.5px;opacity:.75}
.dot.seen::after{display:none}
@keyframes halo{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.tip{position:absolute;pointer-events:none;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);font:500 13px var(--f-body);padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:2}
.tip.on{opacity:1}
.hintline{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;margin:0}

.index{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber)}
.chip.seen::before{background:var(--teal)}
.chip:hover{border-color:var(--amber)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;border:1px solid var(--line);
  left:0;right:0;bottom:0;max-height:82%;border-radius:20px 20px 0 0;transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
@media (min-width:860px){
  .sheet{left:auto;top:0;bottom:0;right:0;width:440px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(104%);padding-top:env(safe-area-inset-top,0px)}
}
.sheet-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 4px}
.icon-btn{font:500 14px var(--f-body);background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.sheet-body{overflow-y:auto;padding:6px 22px 18px;min-width:0}
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:0}
.sheet h2,.classic h2{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.01em;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-weight:500}
.sheet-nav{display:flex;justify-content:space-between;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.sheet-nav button{font:500 14px var(--f-body);background:none;border:0;color:var(--amber);cursor:pointer;padding:6px 0;max-width:48%;text-align:left}
.sheet-nav button:last-child{text-align:right}

.content p{margin:0 0 12px;max-width:62ch}
.content ul{margin:0 0 12px;padding-left:18px;display:grid;gap:8px}
.content li::marker{color:var(--amber)}
.content b{font-weight:600}
.lead{font-size:18px;line-height:1.45}
.about-head{display:flex;gap:16px;align-items:center;margin:4px 0 14px}
.portrait{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--amber-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 0}
.facts div{background:var(--raised);border-radius:12px;padding:10px 12px}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500}
.timeline{list-style:none;padding:0!important;gap:16px!important}
.timeline li{display:grid;gap:2px;padding-left:14px;border-left:2px solid var(--line)}
.timeline .role{font-weight:600}
.timeline .org{color:var(--muted)}
.timeline .when{font-family:var(--f-mono);font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums}
.timeline .what{font-size:15px}
.skills h3{font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.skill{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);gap:12px}
.dots{display:inline-flex;gap:5px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--amber)}
.dots i.f{background:var(--amber)}
.lang{display:grid;gap:6px;margin:0 0 14px}
.lang .row{display:flex;justify-content:space-between;font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:99px}
.badge{display:inline-block;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--amber);color:#1A1617;border-radius:6px;padding:3px 8px;margin-bottom:10px}
.contact-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--raised);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.contact-row .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.contact-row .val{font-weight:500;user-select:all;word-break:break-all}
.copy{font:500 13px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:6px 12px;cursor:pointer}

.classic{background:var(--surface);border-radius:18px;padding:28px clamp(18px,4vw,44px);border:1px solid var(--line)}
.classic section{padding:18px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:20px}
.classic section:first-child{border-top:0;padding-top:0}
.classic section > div{min-width:0}
.classic h2{font-size:22px}
@media (max-width:700px){.classic section{grid-template-columns:1fr;gap:6px}}
footer{color:var(--muted);font-size:14px;text-align:center}
footer button{font:inherit;color:var(--amber);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.contact-row a{color:var(--amber)}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="h-role"></p>
      <h1 id="h-name"></h1>
      <p class="intro" id="h-intro"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="View">
        <button id="v-room" aria-pressed="true">Room</button>
        <button id="v-classic" aria-pressed="false">Classic CV</button>
      </div>
      <span class="counter" id="counter">Explored <b>0</b> / 13</span>
    </div>
  </header>

  <div id="room-view" class="wrap" style="gap:14px">
    <div class="stage" id="stage">
      <div class="room" id="room">
        <img src="room.jpg" alt="Isometric illustration of a cosy room with a desk, bookshelf, window over the Acropolis, plant, camera and a sleeping dog">
      </div>
      <div class="tip" id="tip"></div>
    </div>
    <p class="hintline">Glowing dots mark things to explore</p>
    <nav class="index" id="index" aria-label="Everything in the room"></nav>
  </div>

  <div id="classic-view" class="classic" hidden></div>

  <footer><span id="foot-room">Short on time? <button id="foot-classic">Read the classic CV</button></span><span id="foot-cl" hidden>Want the fun version? <button id="foot-back">Go back to the room</button></span></footer>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" aria-hidden="true">
  <div class="sheet-top"><span class="kicker" id="s-kicker"></span><button class="icon-btn" id="s-close">Close</button></div>
  <div class="sheet-body"><h2 id="s-title"></h2><p class="sub" id="s-sub"></p><div class="content" id="s-content"></div></div>
  <div class="sheet-nav"><button id="s-prev"></button><button id="s-next"></button></div>
</aside>

<!-- Τα κείμενα βρίσκονται στο content.js -->
<script src="content.js"></script>
<script>
(function(){
const C=window.CONTENT;
const $=id=>document.getElementById(id);

// Θέσεις αντικειμένων πάνω στην εικόνα room.jpg (ποσοστά). Άλλαξέ τες μόνο αν αλλάξει η εικόνα.
// dot: [x, y]   box: [αριστερά, πάνω, δεξιά, κάτω]
const POS={
 about:{dot:[74.5,38],box:[71.5,28,77.5,49]},
 current:{dot:[39,45],box:[31.5,37,46,53]},
 past:{dot:[36.5,60],box:[33,54,40,68]},
 education:{dot:[50.5,34],box:[46,21,53.5,52]},
 award:{dot:[49,14],box:[46.5,8.5,52,20.5]},
 skills:{dot:[37.5,32],box:[33,24,41.5,42]},
 languages:{dot:[63,38],box:[60.5,33,66,45]},
 dance:{dot:[57,28],box:[54.3,14,60,41]},
 volunteer:{dot:[63,76],box:[58.5,71,68,83]},
 mentor:{dot:[72.5,58],box:[67.5,49,78,73]},
 video:{dot:[59.5,47],box:[56.5,44,63,69]},
 running:{dot:[50.5,87],box:[46.5,83,55,93]},
 contact:{dot:[26.5,41],box:[22,28,30.5,70]}
};
const ORDER=['about','current','past','education','award','skills','languages','dance','volunteer','mentor','video','running','contact'];
const CLASSIC=['about','current','past','education','skills','languages','award','dance','volunteer','mentor','video','running','contact'];

// ---- turn the content into HTML ----
const paras=a=>(a||[]).map(p=>'<p>'+p+'</p>').join('');
const dots=n=>'<span class="dots" aria-label="'+n+' of 3">'+[1,2,3].map(i=>'<i class="'+(i<=n?'f':'')+'"></i>').join('')+'</span>';
const timeline=e=>'<ul class="timeline">'+e.map(([role,org,when,what])=>'<li><span class="when">'+when+'</span><span class="role">'+role+'</span><span class="org">'+org+'</span>'+(what?'<span class="what">'+what+'</span>':'')+'</li>').join('')+'</ul>';
const row=(lbl,val,extra)=>'<div class="contact-row"><div><span class="lbl">'+lbl+'</span><span class="val">'+val+'</span></div>'+(extra||'')+'</div>';
const BUILD={
 about:s=>'<div class="about-head"><img class="portrait" src="photo.jpg" alt="Portrait of '+C.name+'"><p class="lead" style="margin:0">'+s.lead+'</p></div>'+paras(s.paragraphs)+
   '<dl class="facts">'+(s.facts||[]).map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+v+'</dd></div>').join('')+'</dl>',
 current:s=>'<ul>'+s.bullets.map(([b,t])=>'<li><b>'+b+'</b> '+t+'</li>').join('')+'</ul>',
 past:s=>timeline(s.entries),
 education:s=>timeline(s.entries),
 award:s=>(s.badge?'<span class="badge">'+s.badge+'</span>':'')+paras(s.paragraphs),
 skills:s=>'<div class="skills">'+s.groups.map(g=>'<h3>'+g.title+'</h3>'+g.items.map(([n,l])=>'<div class="skill"><span>'+n+'</span>'+dots(l)+'</div>').join('')).join('')+'</div>',
 languages:s=>s.items.map(([n,p,lvl])=>'<div class="lang"><div class="row"><span>'+n+'</span><span>'+(lvl||'')+'</span></div><div class="bar"><span style="width:'+p+'%"></span></div></div>').join(''),
 contact:s=>(s.email?row('Email','<span id="mail">'+s.email+'</span>','<button class="copy" data-copy="'+s.email+'">Copy</button>'):'')+
   (s.phone?row('Phone',s.phone):'')+
   (s.linkedinName||s.linkedinUrl?row('LinkedIn',s.linkedinUrl?'<a href="'+s.linkedinUrl+'" target="_blank" rel="noopener">'+(s.linkedinName||'Profile')+'</a>':s.linkedinName):'')+
   (s.location?row('Location',s.location):'')
};
const ITEMS={};
ORDER.forEach(id=>{const s=C[id];ITEMS[id]=Object.assign({},s,POS[id],{html:(BUILD[id]||(x=>paras(x.paragraphs)))(s)})});

$('h-name').textContent=C.name;$('h-role').textContent=C.role;$('h-intro').textContent=C.intro;
document.title=C.name.split(' ')[0]+'\'s Room';
$('counter').innerHTML='Explored <b>0</b> / '+ORDER.length;

let seen=new Set();
try{seen=new Set(JSON.parse(localStorage.getItem('ioanna-room-seen')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('ioanna-room-seen',JSON.stringify([...seen]))}catch(e){}};

const room=$('room'),index=$('index'),tip=$('tip'),stage=$('stage');
ORDER.forEach(id=>{
  const it=ITEMS[id],[l,t,r,b]=it.box;
  const s=document.createElement('button');s.className='spot';s.type='button';s.dataset.id=id;s.setAttribute('aria-label',it.label);
  Object.assign(s.style,{left:l+'%',top:t+'%',width:(r-l)+'%',height:(b-t)+'%'});
  s.addEventListener('click',()=>open(id,s));
  const show=()=>{const rr=s.getBoundingClientRect(),ss=stage.getBoundingClientRect();tip.textContent=it.label;tip.style.left=(rr.left-ss.left+rr.width/2)+'px';tip.style.top=Math.max(26,rr.top-ss.top-6)+'px';tip.classList.add('on')};
  s.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show()});
  s.addEventListener('pointerleave',()=>tip.classList.remove('on'));
  s.addEventListener('focus',show);s.addEventListener('blur',()=>tip.classList.remove('on'));
  room.appendChild(s);
  const d=document.createElement('span');d.className='dot';d.dataset.id=id;d.style.left=it.dot[0]+'%';d.style.top=it.dot[1]+'%';room.appendChild(d);
  const c=document.createElement('button');c.className='chip';c.type='button';c.textContent=it.label;c.dataset.id=id;c.addEventListener('click',()=>open(id,c));index.appendChild(c);
});
function refresh(){
  document.querySelectorAll('.dot,.chip').forEach(el=>el.classList.toggle('seen',seen.has(el.dataset.id)));
  $('counter').innerHTML='Explored <b>'+seen.size+'</b> / '+ORDER.length;
}

const sheet=$('sheet'),back=$('backdrop');let current=null,returnTo=null;
function open(id,from){
  const it=ITEMS[id];current=id;if(from)returnTo=from;
  $('s-kicker').textContent=it.kicker;$('s-title').textContent=it.title;
  $('s-sub').textContent=it.sub||'';$('s-sub').hidden=!it.sub;
  $('s-content').innerHTML=it.html;
  const i=ORDER.indexOf(id),p=ORDER[(i-1+ORDER.length)%ORDER.length],n=ORDER[(i+1)%ORDER.length];
  $('s-prev').textContent='← '+ITEMS[p].label;$('s-prev').dataset.id=p;
  $('s-next').textContent=ITEMS[n].label+' →';$('s-next').dataset.id=n;
  sheet.querySelector('.sheet-body').scrollTop=0;
  sheet.classList.add('on');back.classList.add('on');sheet.setAttribute('aria-hidden','false');tip.classList.remove('on');
  seen.add(id);save();refresh();
  $('s-close').focus({preventScroll:true});
}
function close(){sheet.classList.remove('on');back.classList.remove('on');sheet.setAttribute('aria-hidden','true');current=null;if(returnTo&&returnTo.focus)returnTo.focus({preventScroll:true})}
$('s-close').addEventListener('click',close);back.addEventListener('click',close);
$('s-prev').addEventListener('click',e=>open(e.currentTarget.dataset.id));
$('s-next').addEventListener('click',e=>open(e.currentTarget.dataset.id));
document.addEventListener('keydown',e=>{if(!current)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')open($('s-next').dataset.id);if(e.key==='ArrowLeft')open($('s-prev').dataset.id)});

document.addEventListener('click',e=>{
  const b=e.target.closest('.copy');if(!b)return;
  const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1600)};
  const fallback=()=>{const v=$('mail');if(v){const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r)}b.textContent='Selected';setTimeout(()=>b.textContent='Copy',1600)};
  try{navigator.clipboard.writeText(b.dataset.copy).then(done,fallback)}catch(err){fallback()}
});

const cv=$('classic-view');
cv.innerHTML=CLASSIC.map(id=>{const it=ITEMS[id];return '<section><div><p class="kicker">'+it.kicker+'</p><h2>'+it.title+'</h2>'+(it.sub?'<p class="sub">'+it.sub+'</p>':'')+'</div><div class="content">'+it.html+'</div></section>'}).join('');
function view(classic){
  $('room-view').hidden=classic;cv.hidden=!classic;
  $('v-room').setAttribute('aria-pressed',String(!classic));$('v-classic').setAttribute('aria-pressed',String(classic));
  $('foot-room').hidden=classic;$('foot-cl').hidden=!classic;$('counter').hidden=classic;
}
$('v-room').addEventListener('click',()=>view(false));$('v-classic').addEventListener('click',()=>view(true));
$('foot-classic').addEventListener('click',()=>{view(true);scrollTo({top:0})});$('foot-back').addEventListener('click',()=>{view(false);scrollTo({top:0})});
refresh();
})();
</script>
</body>
</html>
